# Render Blueprint: New > Blueprint > pick this repo. Secrets are asked for in the dashboard (never put them in Git).
services:
  - type: web
    name: spu-dental-elections
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: RATE_LIMIT
        value: "1200"
      - key: ADMIN_PASSWORD
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
